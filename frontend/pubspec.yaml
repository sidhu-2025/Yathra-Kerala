name: hostel_smart_leave
description: A smart hostel leave management system.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  intl: ^0.18.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.4.1
  path_provider: ^2.1.1
