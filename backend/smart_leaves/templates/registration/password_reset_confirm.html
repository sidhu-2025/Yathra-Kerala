<!DOCTYPE html>
<html>

<head>
    <title>Set New Password</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h1 {
            color: #1a237e;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            margin-bottom: 1rem;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 1rem;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #283593;
        }

        .error {
            color: red;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>New Password</h1>
        {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change Password</button>
        </form>
        {% else %}
        <p>The password reset link was invalid, possibly because it has already been used.</p>
        {% endif %}
    </div>
</body>

</html>
