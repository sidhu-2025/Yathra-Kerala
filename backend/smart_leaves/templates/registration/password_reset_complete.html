<!DOCTYPE html>
<html>

<head>
    <title>Password Reset Complete</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #1a237e;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Password Changed!</h1>
        <p>Your password has been set. You may now go back to the app and log in.</p>
    </div>
</body>

</html>
